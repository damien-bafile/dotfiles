# Font
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Ligatures (Fira Code)
font_features FiraCode Nerd Font +liga +calt

# Open clicked URLs in Firefox
open_url_with /usr/sbin/firefox


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME