# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'

set -g extended-keys on
# Let yazi (and other apps) send kitty image previews through tmux
set -g allow-passthrough on
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
# Prefix
unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Splits
unbind '"'
unbind %
bind \\ split-window -h
bind - split-window -v

# Reload config
bind r source-file ~/.config/tmux/tmux.conf

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -n M-h resize-pane -L 1
bind -n M-l resize-pane -R 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5

# Mouse
set -g mouse on

# Menus
set -g @menus_trigger 'a'
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-c send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status bar
set -g status-position top

# Catppuccin colours
base="#1e1e2e"
mauve="#cba6f7"
lavender="#b4befe"
sapphire="#74c7ec"
text="#cdd6f4"
green="#a6e3a1"
crust="#11111b"
surface1="#45475a"

set -g status-left-length 50
set -g status-right-length 50
# Sapphire bar, mauve while the prefix key is active
set -g status-style "fg=${base},bg=#{?client_prefix,${mauve},${sapphire}}"
set -g status-left "#[fg=${base},bold] #h #[fg=${surface1},nobold]:: #[fg=${base}]#(~/.config/tmux/scripts/ip_status.sh) "
set -g status-justify absolute-centre
set -g status-right ""
set -g window-status-current-format "#[fg=${crust},bold]#I:#W"
set -g window-status-current-style "default"
set -g window-status-format "#[fg=${surface1}] #I:#W"
set -g message-style "fg=${lavender},bg=${base}"
set -g mode-style "fg=${base},bg=${mauve}"
set -g pane-border-style "fg=${text}"
set -g pane-active-border-style "fg=${mauve}"

# Menus styling
set -g @menus_simple_style_selected "fg=${base},bg=${mauve}"
set -g @menus_simple_style "bg=${base}"
set -g @menus_simple_style_border "bg=${base}"
set -g @menus_border_type 'rounded'
set -g @menus_nav_next "#[fg=${green}]-->"
set -g @menus_nav_prev "#[fg=${green}]<--"
set -g @menus_nav_home "#[fg=${green}]<=="

# Resurrect & Continuum
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

set -g extended-keys-format csi-u

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
